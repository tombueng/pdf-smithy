    A sheet of paper on an anvil.

    The shape has to survive being drawn at 16 pixels in a task switcher, so it
    is built from four silhouettes and nothing else — no thin strokes, no fine
    gradients, no detail that turns to mush. The forge glow is what makes it
    readable at a glance in a dark panel; the page is what says "PDF".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb038"/>
      <stop offset="1" stop-color="#e8500f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6673"/>
      <stop offset="1" stop-color="#333b45"/>
    </linearGradient>
  </defs>

  <!-- Forge glow behind everything: the one warm note, and the thing that
       makes the icon identifiable when it is only a few pixels across. -->
  <path d="M32 4 C46 4 57 14 57 27 C57 38 48 45 41 48 L23 48 C16 45 7 38 7 27 C7 14 18 4 32 4 Z"
        fill="url(#glow)" opacity="0.92"/>

  <!-- The document, with the folded corner every file icon has earned. -->
  <path d="M20 11 h16 l10 10 v23 a2 2 0 0 1 -2 2 H20 a2 2 0 0 1 -2 -2 V13 a2 2 0 0 1 2 -2 Z"
        fill="url(#page)"/>
  <path d="M36 11 l10 10 h-8 a2 2 0 0 1 -2 -2 Z" fill="#b8c1cc"/>

  <!-- Three lines of text, spaced so they read as writing rather than stripes. -->
  <g fill="#8d98a6">
    <rect x="23" y="26" width="18" height="2.6" rx="1.3"/>
    <rect x="23" y="32" width="18" height="2.6" rx="1.3"/>
    <rect x="23" y="38" width="11" height="2.6" rx="1.3"/>
  </g>

  <!-- The anvil the page rests on. Its waist and horn are exaggerated on
       purpose: at small sizes a realistic anvil reads as a grey blob. -->
  <path d="M8 47 h9 c2 0 3 1 4 2 h22 c1 -1 2 -2 4 -2 h9 v5 H45 l-2 3 h-22 l-2 -3 H8 Z"
        fill="url(#steel)"/>
  <path d="M24 55 h16 l3 5 H21 Z" fill="url(#steel)"/>
  <rect x="16" y="59" width="32" height="4" rx="1.6" fill="#252b33"/>
</svg>
